# Builds the React/TypeScript site under web/ and deploys it to GitHub Pages.
#
# Pipeline:
#   1. Refresh data/data.js + bosses.js from the addon's Lua sources
#      (web/scripts/build-db.py).
#   2. Install pnpm deps, typecheck, lint, run unit tests.
#   3. `vite build` with the Pages base path baked in.
#   4. Publish the resulting `web/dist` directory as the Pages artifact.
#
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
# pnpm version is pinned via the `packageManager` field in web/package.json
# so local and CI environments stay aligned.

name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "TBCBisTracker/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-extract data from Lua
        run: python3 scripts/build-db.py

      # Set up pnpm *before* setup-node so node's `cache: "pnpm"` resolver
      # can find it on PATH. `package_json_file` points at web/package.json
      # so the action reads its `packageManager` field (which pins the
      # pnpm version) — the default ./package.json doesn't exist at the
      # repo root.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        env:
          # GitHub Pages serves at /<repo>/ — set the Vite base accordingly.
          # `github.event.repository.name` keeps this portable if the repo
          # is renamed or forked under a different name.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
