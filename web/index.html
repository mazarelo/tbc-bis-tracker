<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F0BC52'/%3E%3Ctext x='16' y='22' font-family='Inter,Arial,sans-serif' font-weight='700' font-size='17' fill='%230E0F12' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBC BiS Tracker</title>
    <link rel="preconnect" href="https://wow.zamimg.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      /* Wowhead's power widget enhances anchors that point at wowhead.com
         with rich hover tooltips, item icons, and quality colours. */
      window.whTooltips = {
        colorLinks: true,
        iconizeLinks: true,
        iconSize: "small",
        renameLinks: true,
      };
    </script>
    <script src="https://wow.zamimg.com/widgets/power.js" defer></script>
    <!-- Generated data bundles — produced by scripts/build-db.py from the
         addon's Lua sources. Loaded as globals so we don't have to bundle
         the multi-megabyte database through Vite. The %BASE_URL% token
         is replaced by Vite at build/dev time so the paths work both at
         site root (`vite dev`) and under the Pages sub-path. -->
    <script src="%BASE_URL%data/data.js"></script>
    <script src="%BASE_URL%data/bosses.js"></script>
    <script>
      /* Backfill version metadata when data.js was generated before
         build-db.py learned about web/package.json. Once the workflow
         regenerates data.js with `version` baked in, these defaults
         become no-ops. */
      window.TBC_DATA = window.TBC_DATA || {};
      if (!window.TBC_DATA.version) window.TBC_DATA.version = "1.0.0";
      if (!window.TBC_DATA.addonVersion) window.TBC_DATA.addonVersion = "1.0.0";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
